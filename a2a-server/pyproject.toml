[project]
name = "baseline-a2a-server"
version = "0.1.0"
description = "Baseline Workforce A2A server — JSON-RPC 2.0 bridge from the Agent2Agent protocol to local coding CLIs (Claude Code, Oh My Pi)."
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
